; Autaptic-neuron phase-plot configuration.
; All simulation, model, and plotting parameters live here so the
; simulation can be reproduced/adjusted without touching the code.
; The non-autaptic control neuron is derived automatically from [Neuron]
; by zeroing e, f, and tau.

[Neuron]
name = RS_int
C = 100
k = 0.7
v_r = -60
v_t = -40
v_peak = 35
a = 0.03
b = -2
c = -50
d = 100
e = 0.2
f = 250
tau = 4

[Simulation]
dt = 0.01
T = 1000
I_inj = 90
v_start = -60
u_start = 0
w_start = 0
t_start = 0

[Grid]
v_min = -85
v_max = 40
u_min = -40
u_max = 100
n_grid = 45

[Snapshots]
pre_spike_offset_ms = 0.25
post_spike_offset_ms = 0.1
immediate_autapse_offset_ms = 0.05
late_autapse_offset_ms = 10.0
autapse_died_down_fraction = 0.01
trajectory_window_ms = 35.0
; Hard cap (ms) on how much trajectory is drawn in each phase-plot panel,
; measured from the start of its trajectory window. Leave blank for no cap
; (the trajectory then runs up to the second spike, or trajectory_window_ms
; past the last snapshot if there isn't one).
trajectory_cutoff_ms =

[Figure]
show_nullclines = true
density = 0.8
linewidth = 0.5
dpi = 300

[Output]
phase_plot = ./phase_plots/aqua_RS_int_spike_autapse_vs_control_phase_plot.png
autaptic_time_series = ./phase_plots/aqua_RS_int_spike_autapse_time_series.png
non_autaptic_time_series = ./phase_plots/aqua_RS_int_spike_no_autapse_time_series.png
